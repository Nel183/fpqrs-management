<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - FPQRS Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo text-center">
                <i class="fas fa-file-invoice"></i>
            </div>
            
            <h2 class="text-center mb-4">Iniciar Sesión</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="password-toggle">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="toggle-btn" onclick="togglePasswordVisibility('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="remember-forgot">
                    <label><input type="checkbox" name="remember"> Recuérdame</label>
                    <a href="#">¿Olvidó su contraseña?</a>
                </div>
                
                <button type="submit" class="auth-submit">Iniciar Sesión</button>
                
                <div class="auth-toggle">
                    ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
                </div>
            </form>
            
            <div class="alert alert-info mt-4" role="alert">
                <strong>Credenciales de prueba:</strong>
                <br>
                <small>Usuario: demo@example.com</small>
                <br>
                <small>Contraseña: demo123</small>
            </div>
        </div>
    </div>
</body>
</html>
