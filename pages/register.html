<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - FPQRS Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo text-center">
                <i class="fas fa-file-invoice"></i>
            </div>
            
            <h2 class="text-center mb-4">Crear Cuenta</h2>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Nombre Completo</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="password-toggle">
                        <input type="password" id="password" name="password" required>
                        <button type="button" class="toggle-btn" onclick="togglePasswordVisibility('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="form-help-text">Mínimo 8 caracteres</span>
                </div>
                
                <div class="form-group">
                    <label for="confirm">Confirmar Contraseña</label>
                    <div class="password-toggle">
                        <input type="password" id="confirm" name="confirm" required>
                        <button type="button" class="toggle-btn" onclick="togglePasswordVisibility('confirm')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group-checkbox">
                    <label>
                        <input type="checkbox" name="terms" required>
                        Acepto los términos y condiciones
                    </label>
                </div>
                
                <button type="submit" class="auth-submit">Registrarse</button>
                
                <div class="auth-toggle">
                    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
