<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandeja de Casos - FPQRS Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/case-management.css">
</head>
<body>
    <nav class="navbar">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">
                <i class="fas fa-file-invoice"></i> FPQRS Management
            </a>
            <div class="navbar-nav">
                <a href="case-inbox.html" class="nav-link active">Bandeja</a>
                <a href="registration-form.html" class="nav-link">Nuevo FPQRS</a>
            </div>
        </div>
    </nav>

    <div class="case-management-header">
        <h1>Bandeja de Casos</h1>
        <p>Gestiona tus solicitudes de FPQRS</p>
        <div class="header-actions">
            <a href="registration-form.html" class="btn btn-primary">
                <i class="fas fa-plus"></i> Nuevo FPQRS
            </a>
        </div>
    </div>

    <div class="container-fluid">
        <div class="filters-section">
            <div class="filters-row">
                <div class="filter-group">
                    <label for="filterType">Tipo de FPQRS</label>
                    <select id="filterType">
                        <option value="">Todos</option>
                        <option value="Felicitación">Felicitación</option>
                        <option value="Petición">Petición</option>
                        <option value="Queja">Queja</option>
                        <option value="Reclamo">Reclamo</option>
                        <option value="Sugerencia">Sugerencia</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterStatus">Estado</label>
                    <select id="filterStatus">
                        <option value="">Todos</option>
                        <option value="Pendiente">Pendiente</option>
                        <option value="En Proceso">En Proceso</option>
                        <option value="Resuelto">Resuelto</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button class="btn-filter"><i class="fas fa-filter"></i> Filtrar</button>
                    <button class="btn-reset"><i class="fas fa-redo"></i> Reiniciar</button>
                </div>
            </div>
        </div>

        <div class="cases-list">
            <table class="cases-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Número</th>
                        <th>Tipo</th>
                        <th>Asunto</th>
                        <th>Estado</th>
                        <th>Prioridad</th>
                        <th>Fecha de Creación</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td class="case-number">FPQRS-2026-001</td>
                        <td><span class="case-type queja">Queja</span></td>
                        <td>Atención deficiente en el servicio</td>
                        <td><span class="case-status en-proceso">En Proceso</span></td>
                        <td><span class="case-priority alta">Alta</span></td>
                        <td>10/06/2026</td>
                        <td>
                            <div class="table-actions">
                                <button class="btn-view" title="Ver"><i class="fas fa-eye"></i></button>
                                <button class="btn-edit" title="Editar"><i class="fas fa-edit"></i></button>
                                <button class="btn-delete" title="Eliminar"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
